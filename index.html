<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="tracker">

    <h1>🍕 Pizza Tracker</h1>
    <p>Order #A12345</p>

    <div class="progress">
        <div class="progress-fill stage-3"></div>
    </div>

    <div class="steps">

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Order Received</p>
        </div>

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Preparing</p>
        </div>

        <div class="step active">
            <div class="circle">🔥</div>
            <p>Baking</p>
        </div>

        <div class="step">
            <div class="circle">🚗</div>
            <p>Delivery</p>
        </div>

        <div class="step">
            <div class="circle">🏠</div>
            <p>Delivered</p>
        </div>

    </div>

</div>

</body>
</html>
