<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="tracker">

    <h1 style="padding-bottom: 40px;">The Hungrey Jew - Shabbat Tracker</h1>

    <h1>🥘 Stew</h1>

    <div class="progress">
        <div class="progress-fill stage-60"></div>
    </div>

    <div class="steps" style="padding-bottom: 40px;">

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Browning meat</p>
        </div>

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Chopping veggies</p>
        </div>

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Cooking veggies</p>
        </div>

        <div class="step active">
            <div class="circle">🔥</div>
            <p>Stewing</p>
        </div>

        <div class="step">
            <div class="circle">✅</div>
            <p>Done</p>
        </div>

    </div>

    <h1>🍞 Challah</h1>

    <div class="progress">
        <div class="progress-fill stage-30"></div>
    </div>

    <div class="steps" style="padding-bottom: 40px;">

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Mixing</p>
        </div>

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Kneading</p>
        </div>

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Proofing</p>
        </div>

        <div class="step active">
            <div class="circle">🤏</div>
            <p>Forming</p>
        </div>

        <div class="step">
            <div class="circle">☁️</div>
            <p>Proofing</p>
        </div>

        <div class="step">
            <div class="circle">🔥</div>
            <p>Baking</p>
        </div>

        <div class="step">
            <div class="circle">✅</div>
            <p>Done</p>
        </div>

    </div>

    <h1>🕯️ Shabbat candles</h1>

    <div class="progress">
        <div class="progress-fill stage-50"></div>
    </div>

    <div class="steps">

        <div class="step complete">
            <div class="circle">✓</div>
            <p>Day</p>
        </div>

        <div class="step active">
            <div class="circle">☀️</div>
            <p>Sunset</p>
        </div>

        <div class="step">
            <div class="circle">🌙</div>
            <p>Night</p>
        </div>

    </div>

</div>

</body>
</html>
